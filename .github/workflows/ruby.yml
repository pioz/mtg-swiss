name: Ruby

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['2.7', '3.0', '3.1', '3.2', '4.0']

    steps:
      - uses: actions/checkout@v6
      # Gemfile.lock targets the latest Ruby (some locked gems require Ruby
      # >= 3.3). On older Rubies let Bundler resolve compatible versions, so
      # the gem is tested down to its minimum supported Ruby version.
      - name: Remove Gemfile.lock on older Rubies
        if: matrix.ruby-version != '4.0'
        run: rm Gemfile.lock
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run tests
        run: bundle exec rake test
        env:
          CODECOV: true
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  rubocop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['4.0']

    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run Rubocop
        run: bundle exec rubocop
